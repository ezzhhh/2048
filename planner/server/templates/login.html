{% extends "base.html" %}
{% block title %}Вход · Планер{% endblock %}
{% block body %}
<section class="card login">
  <h1>Только вы</h1>
  <p class="muted">Доска на вашем сервере. Git не используется.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="username">
    <label>Логин
      <input name="user" required autocomplete="username" inputmode="text">
    </label>
    <label>Пароль
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="primary">Войти</button>
  </form>
</section>
{% endblock %}
