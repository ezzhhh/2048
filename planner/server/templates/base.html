<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b3a2f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Планер">
  <title>{% block title %}Планер{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Планер</a>
    {% if request.session.get("uid") %}
    <nav>
      <a href="/">Доска</a>
      <a href="/memory">Память</a>
      <a href="/settings">Настройка</a>
      <form method="post" action="/logout"><button type="submit">Выйти</button></form>
    </nav>
    {% endif %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
